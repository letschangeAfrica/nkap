<!doctype html>

        <g class="nk-spoke nk-s7"><line x1="60" y1="60" x2="60" y2="24" /></g>
        <g class="nk-spoke nk-s8"><line x1="60" y1="60" x2="60" y2="24" /></g>
        <circle class="nk-hub" cx="60" cy="60" r="7" />
